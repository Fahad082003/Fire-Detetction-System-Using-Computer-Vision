@if (live.level() === 'critical') {
  <!-- red pulsing frame around the whole screen while anything is critical -->
  <div class="pointer-events-none fixed inset-0 z-50 animate-alarm shadow-[inset_0_0_0_2px_#ef4444,inset_0_0_80px_rgba(239,68,68,.25)]"></div>
}

<header class="sticky top-0 z-40 flex flex-wrap items-center gap-3 border-b border-ink-700 bg-ink-950/85 px-4 py-3 backdrop-blur md:flex-nowrap md:px-5">
  <div class="flex min-w-0 items-center gap-3">
    <svg viewBox="0 0 32 32" class="h-8 w-8 shrink-0 fill-red-500/15 stroke-red-500" stroke-width="1.6" aria-hidden="true">
      <path d="M16 2 4 7v8c0 7.2 5.1 13.4 12 15 6.9-1.6 12-7.8 12-15V7z" />
      <path d="M8 17h4l2-5 3 9 2-4h5" class="fill-none stroke-slate-100" stroke-linecap="round" />
    </svg>
    <div class="min-w-0">
      <div class="text-sm font-extrabold tracking-[0.22em]">SENTINEL</div>
      <div class="hidden truncate text-xs text-slate-500 sm:block">Emergency Command Center</div>
    </div>
  </div>

  <nav class="flex gap-1" aria-label="Main">
    <a routerLink="/" routerLinkActive="seg-btn-active" [routerLinkActiveOptions]="{ exact: true }" class="seg-btn">Dashboard</a>
    <a routerLink="/floor-plans" routerLinkActive="seg-btn-active" class="seg-btn">Floor Plans</a>
  </nav>

  <div role="status" aria-live="polite"
       class="order-3 flex w-full items-center justify-center gap-2 rounded-full border px-4 py-1.5 text-xs font-bold tracking-[0.12em] md:order-none md:ml-auto md:w-auto {{ levelClass() }}">
    <span class="h-2 w-2 rounded-full bg-current"></span>{{ levelLabel() }}
  </div>

  <div class="ml-auto flex items-center gap-2">
    <span class="flex items-center gap-1.5 text-xs text-slate-400" title="SignalR realtime link">
      <span class="h-2 w-2 rounded-full {{ connection().dot }}"></span>{{ connection().label }}
    </span>
    <time class="hidden w-[70px] text-right font-mono text-sm text-slate-300 lg:block">{{ live.now() | date: 'HH:mm:ss' }}</time>

    <button type="button" class="btn btn-ghost w-9 px-0" (click)="alarm.toggleMute()"
            [attr.aria-pressed]="alarm.muted()" [title]="alarm.muted() ? 'Audible alarm muted' : 'Audible alarm on'">
      <svg viewBox="0 0 24 24" class="h-4 w-4 fill-none stroke-current" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M4 9v6h4l5 4V5L8 9H4z" />
        @if (!alarm.muted()) { <path d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" /> } @else { <path d="m17 9 4 6m0-6-4 6" /> }
      </svg>
    </button>

    @if (push.supported) {
      <button type="button" class="btn btn-ghost hidden sm:inline-flex" [class.btn-success]="push.enabled()" (click)="push.toggle()">
        {{ push.enabled() ? 'Alerts On' : 'Enable Alerts' }}
      </button>
    }

    <button type="button" class="btn btn-danger" (click)="dispatchDialog().open()">
      <svg viewBox="0 0 24 24" class="h-4 w-4 fill-none stroke-current" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M12 3 2 21h20L12 3zm0 6v5m0 3v.01" /></svg>
      <span class="hidden sm:inline">Emergency Dispatch</span>
    </button>

    <button type="button" class="btn btn-ghost btn-sm" (click)="logout()" [title]="'Signed in as ' + (auth.user()?.email ?? '')">Logout</button>
  </div>
</header>

<router-outlet />
<app-dispatch-dialog />
