<main class="grid min-h-full place-items-center p-4">
  <form [formGroup]="form" (ngSubmit)="submit()" novalidate
        class="panel flex w-full max-w-sm flex-col gap-4 p-6">
    <div class="flex items-center gap-3">
      <svg viewBox="0 0 32 32" class="h-9 w-9 fill-red-500/15 stroke-red-500" stroke-width="1.6" aria-hidden="true">
        <path d="M16 2 4 7v8c0 7.2 5.1 13.4 12 15 6.9-1.6 12-7.8 12-15V7z" />
        <path d="M8 17h4l2-5 3 9 2-4h5" class="fill-none stroke-slate-100" stroke-linecap="round" />
      </svg>
      <div>
        <h1 class="text-lg font-extrabold tracking-[0.2em]">FIREVISION AI</h1>
        <p class="text-xs text-slate-500">Emergency Command Center — operator sign in</p>
      </div>
    </div>

    <label class="field">
      <span>Email</span>
      <input class="input" type="email" formControlName="email" autocomplete="username" placeholder="admin@sentinel.local" />
      @if (invalid('email')) { <span class="text-red-400">Enter a valid email address.</span> }
    </label>

    <label class="field">
      <span>Password</span>
      <input class="input" type="password" formControlName="password" autocomplete="current-password" />
      @if (invalid('password')) { <span class="text-red-400">Password must be at least 6 characters.</span> }
    </label>

    @if (error(); as e) {
      <p class="rounded-lg border border-red-500/40 bg-red-500/10 px-3 py-2 text-sm text-red-300" role="alert">{{ e }}</p>
    }

    <button type="submit" class="btn btn-danger h-10" [disabled]="loading()">
      {{ loading() ? 'Signing in…' : 'Sign in' }}
    </button>
  </form>
</main>
